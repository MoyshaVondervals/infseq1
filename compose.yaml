services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infseq
      POSTGRES_USER: infseq
      POSTGRES_PASSWORD: infseq
    ports:
      - "5433:5432"
    volumes:
      - infseq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infseq -d infseq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  infseq-postgres:
